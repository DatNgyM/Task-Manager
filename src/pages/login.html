<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Task Manager</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h1>📋 Task Manager</h1>
            </div>
            <ul class="nav-links">
                <li><a href="../../index.html">Trang Chủ</a></li>
                <li><a href="task-list.html">Danh Sách</a></li>
                <li><a href="add-task.html">Thêm Mới</a></li>
                <li><a href="login.html" class="active">Đăng Nhập</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="login-container">
            <div class="login-box">
                <div class="login-header">
                    <span class="login-icon">🔐</span>
                    <h2>Đăng Nhập</h2>
                    <p>Vui lòng đăng nhập để tiếp tục</p>
                </div>
                
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email"
                            placeholder="example@email.com" 
                            required
                        >
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Mật khẩu</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="Nhập mật khẩu của bạn" 
                            required
                        >
                        <span class="error-message" id="passwordError"></span>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            <span>Ghi nhớ đăng nhập</span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-login">
                        Đăng Nhập
                    </button>
                </form>

                <div class="login-footer">
                    <p><a href="../../index.html" class="back-link">← Quay về trang chủ</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Task Manager. Dự án thực hành Git Workflow.</p>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
