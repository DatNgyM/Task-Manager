<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Công Việc - Task Manager</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/task-list.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h1>📋 Task Manager</h1>
            </div>
            <ul class="nav-links">
                <li><a href="../../index.html">Trang Chủ</a></li>
                <li><a href="task-list.html" class="active">Danh Sách</a></li>
                <li><a href="add-task.html">Thêm Mới</a></li>
                <li><a href="login.html">Đăng Nhập</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <!-- Filters Section -->
        <section class="filters-section">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">
                    <span class="filter-icon">📌</span> Tất Cả
                </button>
                <button class="filter-btn" data-filter="pending">
                    <span class="filter-icon">⏳</span> Chưa Hoàn Thành
                </button>
                <button class="filter-btn" data-filter="completed">
                    <span class="filter-icon">✅</span> Đã Hoàn Thành
                </button>
            </div>
            <a href="add-task.html" class="btn-primary">+ Thêm Công Việc</a>
        </section>

        <!-- Task List Container -->
        <section class="task-list-container">
            <h2>Danh Sách Công Việc</h2>
            <div id="taskList" class="task-list">
                <div class="empty-state">
                    <p class="empty-icon">📭</p>
                    <p class="empty-text">Không có công việc nào. Hãy thêm công việc mới!</p>
                </div>
            </div>
        </section>

        <!-- Stats Section -->
        <section class="stats-section">
            <div class="stat-card">
                <span class="stat-label">Tổng Cộng</span>
                <span class="stat-value" id="totalTasks">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Đã Hoàn Thành</span>
                <span class="stat-value completed" id="completedTasks">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Chưa Hoàn Thành</span>
                <span class="stat-value pending" id="pendingTasks">0</span>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Task Manager. Dự án thực hành Git Workflow.</p>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/task-list.js"></script>
</body>
</html>
